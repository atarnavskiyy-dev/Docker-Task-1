
name: docker-compose-actions-workflow

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the stack
        run: docker compose up -d --build

      - name: Check web service
        run: docker compose ps --services | grep -x web

      - name: Check redis service
        run: docker compose ps --services | grep -x redis

      - name: Wait for Flask
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Test containers functionality
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./.github/tests
        env:
          CYPRESS_BASE_URL: http://localhost:8080

      - name: Stop containers
        if: always()
        run: docker compose down
